# Render Blueprint — IBPJ Mobile & API (Produção em Nuvem)
# Documentação: https://render.com/docs/blueprint-spec
# Para fazer o deploy:
# 1. Acesse https://dashboard.render.com/blueprints
# 2. Conecte o repositório GitHub (GelimTH/projeto-igreja-ibpj) na branch feat/ibpj-mobile-android (ou main)
# 3. O Render criará automaticamente o banco PostgreSQL gerenciado e a API Node.js/Express.

databases:
  - name: ibpj-postgres
    databaseName: ibpj_db
    user: ibpj_user
    plan: free
    region: oregon

services:
  # 1. Backend API (Node.js + Express + Prisma + Landing Page de Download do APK)
  - type: web
    name: ibpj-api
    runtime: node
    plan: free
    region: oregon
    rootDir: Back/ibpj-api
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && node prisma/seed.js
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: ibpj-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: PUBLIC_API_URL
        value: https://ibpj-api.onrender.com
      - key: APK_DOWNLOAD_URL
        value: https://github.com/Yue-rodri/igrejabatista/releases/latest/download/IBPJ-Mobile-release.apk

  # 2. Frontend Web & Página de Download (Opcional - Static Site no Render)
  - type: web
    name: ibpj-mobile-web
    runtime: static
    rootDir: Front/front-ibpj
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://ibpj-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
